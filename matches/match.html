<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Centre — TPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-color: #f2f2f2; 
            --text-main: #1a1a1a; 
            --grid-line: rgba(0,0,0,0.08); 
            --tpl-blue: #0f172a;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        .grid-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 1; display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            border-left: 1px solid var(--grid-line); 
            border-right: 1px solid var(--grid-line); 
        }
        .grid-line { border-right: 1px solid var(--grid-line); height: 100%; }

        .hero-title { 
            font-weight: 900; 
            font-size: clamp(2.2rem, 8vw, 5rem); 
            line-height: 1; 
            text-transform: uppercase; 
            letter-spacing: -0.05em; 
            color: var(--text-main);
        }

        .section-divider {
            border-top: 1px solid var(--text-main);
            margin-top: 3rem;
            padding-top: 1rem;
            position: relative;
            z-index: 10;
        }

        .score-container {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            text-transform: uppercase;
        }

        .score-big {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.05em;
            line-height: 1;
        }

        .overs-label {
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            font-weight: 700;
            color: #666;
            font-style: italic;
        }

        .losing-team { opacity: 0.45; }

        .table-wrapper {
            width: 100%;
            position: relative;
            z-index: 10;
            margin-bottom: 4rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 500px;
            border-collapse: collapse;
            text-transform: uppercase;
            font-size: 0.75rem; 
            letter-spacing: 0.05em;
        }

        thead { border-bottom: 2px solid var(--text-main); }

        th {
            padding: 1rem 0.5rem;
            font-weight: 900;
            text-align: right;
            color: #888;
        }

        th:first-child { text-align: left; color: var(--text-main); }

        td {
            padding: 1rem 0.5rem;
            border-bottom: 1px solid var(--grid-line);
            text-align: right;
            background: white;
        }

        td:first-child { 
            text-align: left; 
            font-weight: 700;
            font-size: 1rem;
            font-style: italic;
            letter-spacing: -0.02em;
        }

        .team-header-unit { display: flex; align-items: center; gap: 1rem; }
        .team-logo-mid { width: 40px; height: 40px; object-fit: contain; }
        .main-header-logo { width: clamp(35px, 7vw, 70px); height: clamp(35px, 7vw, 70px); object-fit: contain; }

        .super-over-box {
            background: var(--text-main);
            color: white;
            padding: 2rem;
            margin-top: 2rem;
            position: relative;
            z-index: 10;
            display: none;
        }

        .nav-link { position: relative; overflow: hidden; font-weight: 500; text-decoration: none; color: inherit; }
        .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: currentColor; transform: translateX(-101%); transition: transform 0.3s ease; }
        .nav-link:hover::after { transform: translateX(0); }

        @media (max-width: 768px) {
            .hero-title { font-size: 2rem; }
            td:first-child { font-size: 0.85rem; }
            .team-logo-mid { width: 30px; height: 30px; }
            .section-divider { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }
    </style>
</head>

        function renderMatch() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || "1";
            const data = matchesData[id];

            if(!data) {
                document.getElementById('matchTitle').innerText = "Data Pending...";
                return;
            }

            document.getElementById('matchNumber').innerText = `Match ${id.padStart(2, '0')} — Completed`;
            document.getElementById('matchTitle').innerText = data.title;
            document.getElementById('matchOutcome').innerText = data.outcome;
            document.getElementById('logo1').src = `../assets/logos/teams/${data.team1.abbr.toLowerCase()}.png`;
            document.getElementById('logo2').src = `../assets/logos/teams/${data.team2.abbr.toLowerCase()}.png`;

            document.getElementById('team1Name').innerText = data.team1.name;
            document.getElementById('team1Score').innerText = data.team1.score;
            document.getElementById('team1Overs').innerText = `${data.team1.overs} OV`;
            document.getElementById('inningsLogo1').src = `../assets/logos/teams/${data.team1.abbr.toLowerCase()}.png`;
            
            document.getElementById('team2Name').innerText = data.team2.name;
            document.getElementById('team2Score').innerText = data.team2.score;
            document.getElementById('team2Overs').innerText = `${data.team2.overs} OV`;
            document.getElementById('inningsLogo2').src = `../assets/logos/teams/${data.team2.abbr.toLowerCase()}.png`;

            if (data.winner === data.team1.abbr) {
                document.getElementById('team2Header').classList.add('losing-team');
                document.getElementById('team1Header').classList.remove('losing-team');
            } else {
                document.getElementById('team1Header').classList.add('losing-team');
                document.getElementById('team2Header').classList.remove('losing-team');
            }

            document.getElementById('team1Batting').innerHTML = data.team1.batting.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[5]}</td></tr>`).join('');
            document.getElementById('team2Batting').innerHTML = data.team2.batting.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[5]}</td></tr>`).join('');

            const soSection = document.getElementById('superOverSection');
            if (data.superOver) {
                soSection.style.display = 'block';
                document.getElementById('soScore1').innerText = data.superOver.team1;
                document.getElementById('soScore2').innerText = data.superOver.team2;
                document.getElementById('soResult').innerText = data.superOver.result;
                document.getElementById('soLogo1').src = `../assets/logos/teams/${data.winner.toLowerCase()}.png`;
                document.getElementById('soLogo2').src = `../assets/logos/teams/${(data.winner === data.team1.abbr ? data.team2.abbr : data.team1.abbr).toLowerCase()}.png`;
            } else {
                soSection.style.display = 'none';
            }
        }

        window.onload = renderMatch;
    </script>
