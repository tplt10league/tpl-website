<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings — TPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-color: #f2f2f2; 
            --text-main: #1a1a1a; 
            --grid-line: rgba(0,0,0,0.08); 
            --pos-green: #008c4a;
            --neg-red: #d93025;
            --tpl-blue: #0f172a;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        .grid-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 1; display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            border-left: 1px solid var(--grid-line); 
            border-right: 1px solid var(--grid-line); 
        }
        .grid-line { border-right: 1px solid var(--grid-line); height: 100%; }

        .hero-title { 
            font-weight: 900; 
            font-size: clamp(2.5rem, 10vw, 6rem); 
            line-height: 0.9; 
            text-transform: uppercase; 
            letter-spacing: -0.05em; 
            color: var(--text-main);
        }

        .table-wrapper {
            width: 100%;
            position: relative;
            z-index: 10;
            margin-top: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-transform: uppercase;
            font-size: 0.75rem; 
            letter-spacing: 0.02em;
        }

        thead {
            background-color: var(--tpl-blue);
            color: white;
        }

        th {
            padding: 1rem 0.25rem;
            font-weight: 700;
            text-align: center;
        }

        td {
            padding: 1rem 0.25rem;
            border-bottom: 1px solid var(--grid-line);
            vertical-align: middle;
            background: white;
            text-align: center;
        }

        .team-cell {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.4rem;
        }

        .team-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .nrr-pos { color: var(--pos-green); font-weight: 700; }
        .nrr-neg { color: var(--neg-red); font-weight: 700; }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 900;
            padding: 2px 4px;
            border-radius: 2px;
        }
        .status-q { color: var(--pos-green); }
        .status-e { color: var(--neg-red); }

        .nav-link { position: relative; overflow: hidden; font-weight: 500; text-decoration: none; color: inherit; }
        .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: currentColor; transform: translateX(-101%); transition: transform 0.3s ease; }
        .nav-link:hover::after { transform: translateX(0); }

        @media (max-width: 480px) {
            table { font-size: 0.65rem; }
            .team-name { font-size: 0.85rem; }
            th, td { padding: 0.75rem 0.15rem; }
            .team-logo { width: 18px; height: 18px; }
        }
    </style>
</head>
