<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — TPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-color: #f2f2f2; 
            --text-main: #1a1a1a; 
            --grid-line: rgba(0,0,0,0.08); 
            --tpl-blue: #0f172a;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        .grid-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 1; display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            border-left: 1px solid var(--grid-line); 
            border-right: 1px solid var(--grid-line); 
        }
        .grid-line { border-right: 1px solid var(--grid-line); height: 100%; }

        .hero-title { 
            font-weight: 900; 
            font-size: clamp(2rem, 8vw, 5rem); 
            line-height: 1; 
            text-transform: uppercase; 
            letter-spacing: -0.05em; 
            color: var(--text-main);
        }

        .table-wrapper { width: 100%; position: relative; z-index: 10; margin-top: 3rem; margin-bottom: 5rem; overflow-x: auto; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        thead { background-color: var(--tpl-blue); color: white; }
        th { padding: 1.25rem 0.5rem; font-weight: 700; text-align: center; }
        td { padding: 1.25rem 0.5rem; border-bottom: 1px solid var(--grid-line); vertical-align: middle; background: white; text-align: center; }

        .player-cell { display: flex; align-items: center; justify-content: flex-start; gap: 1rem; text-align: left; }
        .player-name { font-size: 1.1rem; font-weight: 900; font-style: italic; letter-spacing: -0.02em; line-height: 1; }
        .team-logo-mini { width: 32px; height: 32px; object-fit: contain; }
        .highlight-val { font-weight: 900; font-size: 1.2rem; color: var(--text-main); }

        .nav-link { position: relative; overflow: hidden; font-weight: 500; text-decoration: none; color: inherit; }
        .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: currentColor; transform: translateX(-101%); transition: transform 0.3s ease; }
        .nav-link:hover::after { transform: translateX(0); }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .player-name { font-size: 0.9rem; }
            .highlight-val { font-size: 1rem; }
            th, td { padding: 1rem 0.25rem; }
        }
    </style>
</head>
<body class="p-4 md:p-12">

            <a href="index.html" class="nav-link">Home</a>
            <a href="stats.html" class="nav-link">Stats Hub</a>

        function renderLeaderboard() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || "mvp";
            const data = leaderboardData[type];

            if(!data) { document.getElementById('statTitle').innerText = "Not Found"; return; }

            document.getElementById('statTitle').innerText = data.title;
            document.getElementById('statCategory').innerText = data.label;
            document.getElementById('tableHeader').innerHTML = data.headers.map(h => `<th>${h}</th>`).join('');

            document.getElementById('tableBody').innerHTML = data.rows.map(row => {
                const teamAbbr = row[2].toLowerCase();
                const posCell = `<td class="font-bold">${row[0]}</td>`;
                
                const playerCell = `
                <td>
                    <div class="player-cell">
                        <img src="assets/logos/teams/${teamAbbr}.png" class="team-logo-mini" alt="${row[2]}">
                        <span class="player-name">${row[1]}</span>
                    </div>
                </td>`;
                
                const middleStats = row.slice(3, -1).map(val => `<td>${val}</td>`).join('');
                const finalStat = `<td class="highlight-val">${row[row.length - 1]}</td>`;
                
                return `<tr>${posCell}${playerCell}${middleStats}${finalStat}</tr>`;
            }).join('');
        }

        window.onload = renderLeaderboard;
